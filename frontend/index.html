<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXTRA</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-gray-100 text-gray-900 font-sans h-screen w-screen overflow-hidden m-0 p-0">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- SECURE LOGOUT MODAL -->
    <script>
        window.triggerLogout = function() {
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 z-[9999] bg-slate-900/40 backdrop-blur-md flex items-center justify-center";
            overlay.style.animation = "fadeIn 0.2s ease-out forwards";
            
            if (!document.getElementById('logout-styles')) {
                const style = document.createElement('style');
                style.id = 'logout-styles';
                style.innerHTML = `@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } } @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }`;
                document.head.appendChild(style);
            }

            overlay.innerHTML = `
                <div class="bg-white/95 backdrop-blur-3xl border-2 border-indigo-100 p-8 rounded-3xl shadow-[0_20px_50px_rgba(99,102,241,0.2)] max-w-sm w-full mx-4 text-center" style="animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;">
                    <div class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-100 shadow-inner">
                        <svg class="w-8 h-8 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </div>
                    <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-blue-500 tracking-tight mb-1">NEXTRA</h2>
                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-8">Terminate Secure Session?</p>
                    <div class="flex space-x-3">
                        <button onclick="document.body.removeChild(this.closest('.fixed'))" class="flex-1 px-4 py-3 bg-gray-50 hover:bg-gray-100 text-gray-600 text-[10px] font-black uppercase tracking-widest rounded-xl transition-all border border-gray-200 shadow-sm">Cancel</button>
                        <button onclick="localStorage.removeItem('nextra_token'); localStorage.removeItem('nextra_user'); window.location.href='/login'" class="flex-1 px-4 py-3 bg-gradient-to-r from-indigo-600 to-blue-500 hover:from-indigo-700 hover:to-blue-600 text-white text-[10px] font-black uppercase tracking-widest rounded-xl transition-all shadow-lg shadow-indigo-500/30 transform hover:-translate-y-0.5">Logout</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }
    </script>
  </body>
</html>
